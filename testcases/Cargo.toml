# Every testcase is a package of this workspace; see run.sh.
[workspace]
resolver = "3"
members = [
    "channel",
    "drop_thread_local",
    "erased_drop",
    "format_callback",
    "hash_callback",
    "order",
    "queued_closure",
    "rayon_job",
    "same_signature_method",
    "same_trait_impl",
    "same_type_pointer",
    "signal_handler",
    "skip_flag",
    "std_callback",
    "thread_local_accessor",
    "thread_spawn_hook",
    "tokio_cancel",
    "tokio_lifecycle",
    "tokio_shutdown",
    "tokio_spawn_blocking",
    "tokio_spawn_local",
    "tokio_task",
    "tokio_waker",
    "unused_vtable_slot",
    "waker",
    "wrong_data",
]
